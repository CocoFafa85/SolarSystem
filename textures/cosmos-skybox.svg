<!-- LOT 16 #11 — Skybox cosmos vectoriel (archive, non actif).
     Format equirectangulaire 2048×1024 pour mapping sphère/cube map.
     Décision LOT 16 : conservé en archive, texture stars_milkyway.jpg
     reste active (rendu vectoriel à 1024 cube map = perte de netteté). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" width="2048" height="1024">
  <defs>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a5a90" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4a5a90" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a3a6a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8a3a6a" stop-opacity="0"/>
