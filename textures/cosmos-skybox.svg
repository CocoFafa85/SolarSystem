    <radialGradient id="neb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a6a8a" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#3a6a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mw" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2a4a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1a2a4a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond cosmos très sombre -->
