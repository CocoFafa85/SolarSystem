<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05060a" />
  <title data-i18n="app.title">Solar System — Simulation 1:1</title>

  <!-- LOT 14 — SEO + Open Graph + favicon. -->
  <meta name="description" content="Simulateur 3D du système solaire à l'échelle 1:1 stricte : distances réelles, orbites képlériennes, événements astronomiques (éclipses, super-lunes, éruptions solaires), comparateurs, glossaire animé." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta property="og:title" content="Solar System — Simulation 1:1" />
  <meta property="og:description" content="Naviguez le système solaire à l'échelle réelle. Orbites képlériennes, événements astronomiques, comparateurs de distances." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cocofafa85.github.io/SolarSystem/" />

  <!-- LOT 15 D1 — Google Fonts (Orbitron + Montserrat Alternates) — preconnect avant styles. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Montserrat+Alternates:wght@400;500;700&display=swap">

  <!-- Couche UI (Profile D) — totalement découplée du moteur 3D -->
  <link rel="stylesheet" href="src/ui/styles/index.css" />

  <!-- <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
      }
    }
  </script> -->

  <!-- Point d'entrée unique : `src/main.js` orchestre bootUI() puis le moteur 3D.
       Ne PAS recharger `src/ui/index.js` ici — il serait évalué une seconde fois,
       avec un second bootUI() qui dupliquerait tous les composants HUD. -->
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="app">
    <a href="#hud-bottom" class="visually-hidden" data-i18n="app.skipToHud">Aller aux contrôles</a>

    <canvas id="solarCanvas" aria-label="Scène 3D du système solaire" role="img"></canvas>

    <header
      id="hud-top"
      class="hud hud--top"
      role="region"
      data-i18n-attr="aria-label:hud.topLabel"
    ></header>

    <aside
      id="hud-left"
      class="hud hud--left"
      role="region"
      data-i18n-attr="aria-label:hud.leftLabel"
    ></aside>

    <aside
      id="hud-right"
      class="hud hud--right"
      role="region"
      data-i18n-attr="aria-label:hud.rightLabel"
    ></aside>

    <footer
      id="hud-bottom"
      class="hud hud--bottom"
      role="region"
      data-i18n-attr="aria-label:hud.bottomLabel"
    ></footer>
  </div>
</body>
</html>
